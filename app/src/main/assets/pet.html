<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><style>html,body{margin:0;width:100%;height:100%;background:transparent;overflow:hidden}#wrap{position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center}#pet{width:94%;height:94%;object-fit:contain;user-select:none;-webkit-user-drag:none}.fx{position:absolute;inset:8%;pointer-events:none;opacity:0}.show{animation:pop .55s ease-out}.heart{font-size:42px;color:#ff477e;text-shadow:0 2px 4px #fff;}.star{font-size:36px;color:#ffad1f}@keyframes pop{0%{opacity:0;transform:scale(.4) rotate(-15deg)}35%{opacity:1;transform:scale(1.2) rotate(8deg)}100%{opacity:0;transform:scale(1.5) rotate(20deg)}}@keyframes bob{50%{transform:translateY(-5px)}}#pet{animation:bob 2s ease-in-out infinite}</style></head><body><div id="wrap"><img id="pet" src="file:///android_asset/img/default_stand.png"><div id="fx" class="fx"></div></div><script>const p=document.getElementById('pet'),f=document.getElementById('fx');let taps=0;const imgs=['default_stand.png','bird_happy.png','coding.png','music.png','dog_walk.png','love_phone.png'];function show(src,cls){p.src='file:///android_asset/img/'+src;setTimeout(()=>{p.src='file:///android_asset/img/default_stand.png'},1800);f.className='fx '+cls;f.textContent=cls==='heart'?'♥ ♥':cls==='star'?'✦ ✧':'✹';void f.offsetWidth;f.className='fx '+cls+' show'}window.petEngine={onTap(){taps++;show(imgs[taps%imgs.length],taps%2?'heart':'star')},onDoubleTap(){show('bird_happy.png','star')},onLongPress(){show('love_phone.png','heart')}};</script></body></html>
